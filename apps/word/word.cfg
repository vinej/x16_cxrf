# CXRF Word -- X16 Edit linked as a CXRF app.
# Differences from upstream conf/cx16-asm.cfg:
#  - ZP rides the CXRF app window $60-$7F (upstream $22-$7F; the editor
#    declares 24 bytes, so it fits)
#  - MAIN's ceiling is $8000, the CXRF app-space limit ($9F00 upstream)
#  - our own LOADADDR/EXEHDR (no cc65 runtime library)
MEMORY {
    ZP:       file = "", start = $0060,  size = $0020, define = yes;
    LOADADDR: file = %O, start = $07FF,  size = $0002;
    MAIN:     file = %O, start = $0801,  size = $8000 - $0801;
    VARMEM:   file = "", start = $0400,  size = $0400, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp,  define = yes;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    CODE2:    load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    BSS:      load = MAIN,     type = bss, define = yes;
    VARS:     load = VARMEM,   type = bss, define = yes;
    RAMCODE3: load = MAIN,     type = rw;
}
